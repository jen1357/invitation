<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>저희 결혼합니다</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Gowun Batang', serif;
      background-color: #f4f1ea;
      color: #333;
      display: flex;
      justify-content: center;
    }
    /* 모바일 화면 비율 고정 */
    .container {
      width: 100%;
      max-width: 430px;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      text-align: center;
      padding-bottom: 60px;
    }
    .header { padding: 50px 20px 30px; }
    .date-top { font-size: 14px; letter-spacing: 3px; color: #888; margin-bottom: 12px; }
    .names { font-size: 24px; font-weight: 700; letter-spacing: 4px; color: #222; }
    .main-img {
      width: 100%;
      height: 480px;
      background-color: #e8e4dc;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
      margin: 20px 0;
    }
    .section { padding: 45px 30px; line-height: 2.0; }
    .section-title {
      font-size: 15px;
      color: #8c7b6b;
      letter-spacing: 2px;
      margin-bottom: 25px;
      font-weight: 700;
    }
    .greeting { font-size: 15px; color: #444; word-break: keep-all; }
    .divider { width: 40px; height: 1px; background-color: #ddd; margin: 0 auto; }
    .info-box {
      background-color: #faf9f6;
      padding: 25px 20px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 15px;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 22px;
      background-color: #4a453f;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      font-family: 'Gowun Batang', serif;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 상단 타이틀 -->
    <div class="header">
      <div class="date-top">WEDDING INVITATION</div>
      <div class="names">신랑이름 · 신부이름</div>
    </div>

    <!-- 메인 웨딩 사진 영역 -->
    <div class="main-img">
      이곳에 메인 웨딩 사진이 들어갑니다
    </div>

    <!-- 초대 인사말 -->
    <div class="section">
      <div class="section-title">INVITATION</div>
      <p class="greeting">
        서로가 마주 보며 다져온 사랑을<br>
        이제 함께 한곳을 바라보며<br>
        걸어갈 수 있는 큰 사랑으로 키우고자 합니다.<br><br>
        저희 두 사람이 사랑의 이름으로<br>
        지켜나갈 수 있게 앞날을<br>
        축복해 주시면 감사하겠습니다.
      </p>
    </div>

    <div class="divider"></div>

    <!-- 예식 일시 및 장소 -->
    <div class="section">
      <div class="section-title">WHEN & WHERE</div>
      <div class="info-box">
        <strong>202X년 X월 X일 (토) 오후 X시</strong><br>
        웨딩홀 이름 및 층수 홀이름
      </div>
    </div>

    <div class="divider"></div>

    <!-- 마음 전하실 곳 -->
    <div class="section">
      <div class="section-title">마음 전하실 곳</div>
      <p style="font-size: 14px; color: #666;">참석이 어려우신 분들을 위해<br>계좌번호를 안내해 드립니다.</p>
      <button class="btn" onclick="alert('계좌번호가 복사되었습니다! (추후 실제 복사 기능 연동)')">계좌번호 확인하기</button>
    </div>
  </div>
</body>
</html>
